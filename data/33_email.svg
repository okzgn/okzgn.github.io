<svg id="warm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <style>.ic{fill:none;stroke:#004e9b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  :target .ic{stroke:#c6460c}
  @media (prefers-color-scheme:dark){.ic{stroke:#8ac4ff}:target .ic{stroke:#ff962e}}</style>
  <!-- Email (footer): an envelope; the flap keeps a small gap from the outline. Drawn on a 24-unit grid, scaled to the 80x80 canvas. -->
  <g transform="translate(4,4) scale(3)">
    <rect x="2" y="4" width="20" height="16" rx="2" class="ic"/>
    <polyline points="5.5 8.45 12 13 18.5 8.45" class="ic"/>
  </g>
</svg>
